name: Android-App bauen

on:
  push:
    branches: [main, entwicklung]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Version festlegen (öffentlich oder Test)
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "APP_ID=io.github.schmelzenbart.florian" >> $GITHUB_ENV
            echo "APP_NAME=Florian" >> $GITHUB_ENV
          else
            echo "APP_ID=io.github.schmelzenbart.florian.test" >> $GITHUB_ENV
            echo "APP_NAME=Florian TEST" >> $GITHUB_ENV
            sed -i 's#<div class="brand">FLORIAN</div>#<div class="brand">FLORIAN TEST</div>#' index.html
          fi

      - name: Web-Dateien vorbereiten
        run: |
          mkdir -p build/www build/assets
          cp -r index.html manifest.webmanifest sw.js fonts icons build/www/
          cp android-assets/* build/assets/

      - name: Android-Projekt erzeugen
        working-directory: build
        run: |
          npm init -y >/dev/null
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npm i -D @capacitor/assets
          npx cap init "$APP_NAME" "$APP_ID" --web-dir www
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android
          sed -i 's/<activity/<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle

      - name: APK bauen
        working-directory: build/android
        run: |
          cat >> app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  florian {
                      storeFile file(System.getenv("FLORIAN_KS"))
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes { debug { signingConfig signingConfigs.florian } }
          }
          GRADLE
          export FLORIAN_KS="$GITHUB_WORKSPACE/signing/debug.keystore"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../florian.apk

      - name: Test-App bereitstellen (nur für dich, im GitHub-Konto)
        if: github.ref_name != 'main'
        uses: actions/upload-artifact@v4
        with:
          name: florian-TEST-app
          path: florian.apk
          retention-days: 30

      - name: Als Download veröffentlichen
        if: github.ref_name == 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-${{ github.run_number }}
          name: Florian App 1.${{ github.run_number }}
          body: "Android-App zum Installieren: florian.apk herunterladen und öffnen."
          files: florian.apk
          make_latest: true

      - name: Webseite mit App zusammenstellen
        if: github.ref_name == 'main'
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js fonts icons README.md .nojekyll _site/
          cp florian.apk _site/florian.apk

      - uses: actions/upload-pages-artifact@v4
        if: github.ref_name == 'main'
        with:
          path: _site

  deploy:
    needs: apk
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
